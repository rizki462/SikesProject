<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIKes Riwayat Konsultasi</title>

    <!-- Logo di tab browser -->
    <link rel="icon" type="image/png" href="../IMG/Logo Sikes2.png" />

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <!-- CSS -->
    <link rel="stylesheet" href="../CSS/style_dashboard.css" />
  </head>
  <body>
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="logo">
        <img src="../IMG/Logo Sikes2.png" alt="Logo SiKes" class="logoimg" />
        <span>SIKes</span>
      </div>

      <nav class="menu">
        <a href="dashboard.html" class="menu-link active" data-page="dashboard"> <i class="fa-solid fa-house"></i> Dashboard </a>
        <a href="konsultasi.html" class="menu-link" data-page="konsultasi"> <i class="fa-solid fa-comments"></i> Konsultasi </a>
        <a href="riwayat.html" class="menu-link" data-page="riwayat"> <i class="fa-solid fa-clock-rotate-left"></i> Riwayat Konsultasi </a>
        <a href="pengaturan.html" class="menu-link" data-page="pengaturan"> <i class="fa-solid fa-gear"></i> Pengaturan Akun </a>
        <a href="#" id="logout"> <i class="fa-solid fa-right-from-bracket"></i> Keluar </a>
      </nav>
    </aside>
    <div class="overlay" id="overlay"></div>

    <!-- MAIN -->
    <main class="main">
      <div class="topbar">
        <button class="hamburger" id="hamburger" aria-label="Menu">
          <i class="fa-solid fa-bars"></i>
        </button>
        <h1>Riwayat Konsultasi</h1>
        <div class="user">
          <i class="fa-solid fa-user"></i>
          <span class="nama_pengguna">Rizki Kurnia</span>
        </div>
      </div>

      <footer>© 2025 Sikes – Sistem Informasi Kesehatan</footer>
    </main>

    <!-- MODAL LOGOUT -->
    <div class="modal-logout" id="logoutModal">
      <div class="modal-content">
        <img src="../IMG/Logo Sikes2.png" alt="SIKes" class="modal-logo" />

        <h2>SIKes</h2>
        <p>Apakah Anda yakin ingin keluar dari akun?</p>

        <div class="modal-actions">
          <button class="btn-cancel" id="cancelLogout">Batal</button>
          <button class="btn-confirm" id="confirmLogout">Keluar</button>
        </div>
      </div>
    </div>

    <!-- JS -->
    <script src="../JS/dashboard.js"></script>
  </body>
</html>
