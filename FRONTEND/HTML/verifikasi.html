<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verifikasi - SIKes</title>

    <!-- Logo di tab browser -->
    <link rel="icon" type="image/png" href="../IMG/Logo Sikes2.png" />

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />

    <!-- My Css -->
    <link rel="stylesheet" href="../CSS/style_verifikasi.css" />
  </head>

  <body>
    <section id="LogoApp" class="h-100">
      <div class="container-fluid h-100">
        <div class="row h-100">
          <!-- PANEL KIRI -->
          <div class="col-md-6 left-panel position-relative">
            <!-- Logo dan teks -->
            <div class="container text-center mt-5">
              <div class="row align-items-center justify-content-center">
                <div class="col-auto">
                  <img src="../IMG/Logo Sikes2.png" alt="Logo SiKes" class="logo" />
                </div>
                <div class="col-auto text-start">
                  <h1 class="app-name mb-0">SIKes</h1>
                  <p class="subtitle-atas mb-0">Sistem Informasi</p>
                  <p class="subtitle-bawah mb-0">Kesehatan Digital</p>
                </div>
              </div>
            </div>

            <!-- Gambar Komputer -->
            <div class="container text-center">
              <img src="../IMG/Logo Komputer.png" alt="banner" class="banner" />
            </div>

            <!-- Footer -->
            <div class="container text-start footer">© 2025 Sikes</div>
          </div>

          <!-- PANEL KANAN -->
          <div class="col-md-6 right-panel d-flex text-start">
            <div class="verifikasi-box">
              <img src="../IMG/Logo Sikes2.png" alt="Logo SiKes" class="logo-mobile mb-3" />
              <h3>Verifikasi Email</h3>
              <h4>Periksa email kamu dan klik tautan untuk proses verifikasi</h4>

              <!-- Gambar Ilustrasi -->
              <div class="container text-center">
                <img src="../IMG/ilustrasi2.png" alt="ilustrasi" class="ilustrasi" />
              </div>
              <button type="submit" class="btn-verifikasi mb-3" id="btnMasuk">Masuk ke Dashboard</button>
              <div class="footer-mobile">© 2025 Sikes</div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Verifikasi JS -->
    <script src="../JS/verifikasi.js"></script>
  </body>
</html>
